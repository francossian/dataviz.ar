name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows running the workflow manually from the Actions tab
  workflow_dispatch:

# Minimum permissions the Pages deployment needs
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that's already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Installs deps (detects npm from package-lock.json), runs `astro build`,
      # and uploads dist/ as the Pages artifact
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
